<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
.header { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border-bottom: 1px solid #334155; padding: 20px 32px; }
.header h1 { font-size: 24px; font-weight: 700; color: #f1f5f9; }
.header .sub { font-size: 13px; color: #94a3b8; margin-top: 4px; }
.container { max-width: 1400px; margin: 0 auto; padding: 24px; }

/* Tabs */
.tabs { display: flex; gap: 4px; margin-bottom: 24px; background: #1e293b; border-radius: 10px; padding: 4px; width: fit-content; }
.tab { padding: 10px 24px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; color: #94a3b8; transition: all 0.2s; border: none; background: none; }
.tab:hover { color: #e2e8f0; }
.tab.active { background: #3b82f6; color: #fff; }

/* Summary cards */
.summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
.summary-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
.summary-card .label { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.summary-card .value { font-size: 28px; font-weight: 700; color: #f1f5f9; }
.summary-card .change { font-size: 13px; margin-top: 4px; }
.change.up { color: #34d399; }
.change.down { color: #f87171; }

/* Charts */
.chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
@media (max-width: 900px) { .chart-row { grid-template-columns: 1fr; } }
.chart-panel { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
.chart-panel.full { grid-column: 1 / -1; }
.chart-panel h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #e2e8f0; }
.chart-wrap { position: relative; height: 350px; }
.chart-wrap.tall { height: 420px; }

/* Filter */
.filter-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
.filter-bar .label { font-size: 13px; color: #64748b; }
.chip { padding: 6px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; border: 1px solid #334155; background: #1e293b; color: #94a3b8; transition: all 0.2s; }
.chip:hover { border-color: #3b82f6; color: #e2e8f0; }
.chip.active { background: #3b82f6; border-color: #3b82f6; color: #fff; }

/* Table */
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th { text-align: left; padding: 10px 12px; border-bottom: 2px solid #334155; color: #64748b; font-weight: 600; font-size: 12px; text-transform: uppercase; }
.data-table td { padding: 8px 12px; border-bottom: 1px solid #1e293b; color: #cbd5e1; }
.data-table tr:hover td { background: #1e293b; }
.table-wrap { max-height: 400px; overflow-y: auto; }

.section-title { font-size: 18px; font-weight: 600; margin: 32px 0 16px; color: #f1f5f9; }
.section-title:first-child { margin-top: 0; }

.hidden { display: none; }
</style>
</head>
<body>

<div class="header">
  <h1>Heartopia TikTok 数据看板</h1>

<div class="container">

    <div class="chart-row">

    </div>
    <div class="chart-row">
      <div class="chart-panel full"><h3>视频数趋势</h3><div class="chart-wrap tall"><canvas id="chart-hvideos"></canvas></div></div>
    </div>
  </div>

  <!-- Raw Data Section -->
  <div id="tab-raw" class="hidden">

</div>

// ===== CONSTANTS =====
const ACCOUNTS = ['heartopia_en','heartopia_th','heartopia_jp','heartopia_tw'];
const HASHTAGS = ['heartopia','heartopiagame'];
const ACCOUNT_COLORS = {
  heartopia_en: '#3b82f6',
  heartopia_th: '#34d399',
  heartopia_jp: '#f59e0b',
  heartopia_tw: '#f87171'
};
const HASHTAG_COLORS = {
  heartopia: '#3b82f6',
  heartopiagame: '#f59e0b'
};
const ACCOUNT_LABELS = {
  heartopia_en: 'EN', heartopia_th: 'TH', heartopia_jp: 'JP', heartopia_tw: 'TW'
};

let currentAccountFilter = 'all';
let currentHashtagFilter = 'all';
let charts = {};

// ===== HELPERS =====
function fmt(n) {
  if (Math.abs(n) >= 1e8) return (n/1e8).toFixed(2) + '亿';
  if (Math.abs(n) >= 1e4) return (n/1e4).toFixed(2) + '万';
  return n.toLocaleString();
}

function fmtChange(diff) {
  if (diff > 0) return `<span class="change up">+${fmt(diff)}</span>`;
  if (diff < 0) return `<span class="change down">${fmt(diff)}</span>`;
  return '<span class="change">-</span>';
}

// Parse partial dates to day labels
function dayLabel(ts) {
  return ts.slice(5, 10); // MM-DD
}

// ===== SUMMARY CARDS =====
function renderAccountSummary() {
  const grid = document.getElementById('account-summary');
  let latest = {};
  ACCOUNTS.forEach(a => {
    let rows = accountData.filter(r => r.username === a);
    latest[a] = rows[rows.length - 1];
  });
  grid.innerHTML = ACCOUNTS.map(a => {
    let l = latest[a];
    return `<div class="summary-card" style="border-left: 3px solid ${ACCOUNT_COLORS[a]}">
      <div class="label">${a} <span style="color:${ACCOUNT_COLORS[a]}">${ACCOUNT_LABELS[a]}</span></div>
      <div class="value">${fmt(l.followers)}</div>
      <div style="font-size:13px;color:#94a3b8;margin-top:2px;">粉丝</div>
      <div style="display:flex;gap:20px;margin-top:8px;">
        <div><span style="color:#64748b;font-size:11px;">点赞</span><br><span style="font-size:15px;font-weight:600;">${fmt(l.likes)}</span></div>
        <div><span style="color:#64748b;font-size:11px;">视频</span><br><span style="font-size:15px;font-weight:600;">${l.video_count}</span></div>
      </div>
    </div>`;
  }).join('');
}

function renderHashtagSummary() {
  const grid = document.getElementById('hashtag-summary');
  let latest = {};
  HASHTAGS.forEach(h => {
    let rows = hashtagData.filter(r => r.hashtag === h);
    latest[h] = rows[rows.length - 1];
  });
  grid.innerHTML = HASHTAGS.map(h => {
    let l = latest[h];
    return `<div class="summary-card" style="border-left: 3px solid ${HASHTAG_COLORS[h]}">
      <div class="label">#${h}</div>
      <div class="value">${fmt(l.view_count)}</div>
      <div style="font-size:13px;color:#94a3b8;margin-top:2px;">播放量</div>
      <div style="margin-top:8px;">
        <span style="color:#64748b;font-size:11px;">视频数</span><br>
        <span style="font-size:15px;font-weight:600;">${fmt(l.video_count)}</span>
      </div>
    </div>`;
  }).join('');
}

// ===== ACCOUNT CHARTS =====
function prepareAccountSeries(metric) {
  let filterList = currentAccountFilter === 'all' ? ACCOUNTS : [currentAccountFilter];
  return filterList.map(acc => {
    let rows = accountData.filter(r => r.username === acc);
    rows.sort((a, b) => a.timestamp.localeCompare(b.timestamp));
    return {
      label: acc,
      data: rows.map(r => ({x: dayLabel(r.timestamp), y: r[metric]})),
      borderColor: ACCOUNT_COLORS[acc],
      backgroundColor: ACCOUNT_COLORS[acc] + '20',
      tension: 0.3,
      pointRadius: 3,
      pointHoverRadius: 6,
    };
  });
}

function yBounds(datasets) {
  let min = Infinity, max = -Infinity;
  datasets.forEach(ds => ds.data.forEach(p => {
    if (p.y < min) min = p.y;
    if (p.y > max) max = p.y;
  }));
  if (!isFinite(min)) return {min:0, max:1};
  return {min, max};
}

function sortedLabels(datasets) {
  var set = new Set();
  datasets.forEach(ds => ds.data.forEach(p => set.add(p.x)));
  return Array.from(set).sort();
}

function renderAccountCharts() {
  ['followers','likes','videos'].forEach(k => { if (charts[k]) charts[k].destroy(); });

  var fDatasets = prepareAccountSeries('followers');
  var lDatasets = prepareAccountSeries('likes');
  var vDatasets = prepareAccountSeries('video_count');

  var fBounds = yBounds(fDatasets);
  var lBounds = yBounds(lDatasets);
  var vBounds = yBounds(vDatasets);

  charts.followers = new Chart(document.getElementById('chart-followers'), {
    type: 'line',
    data: { labels: sortedLabels(fDatasets), datasets: fDatasets },
    options: chartOptions('粉丝数', fBounds.min, fBounds.max)
  });
  charts.likes = new Chart(document.getElementById('chart-likes'), {
    type: 'line',
    data: { labels: sortedLabels(lDatasets), datasets: lDatasets },
    options: chartOptions('点赞数', lBounds.min, lBounds.max)
  });
  charts.videos = new Chart(document.getElementById('chart-videos'), {
    type: 'line',
    data: { labels: sortedLabels(vDatasets), datasets: vDatasets },
    options: chartOptions('视频数', vBounds.min, vBounds.max)
  });
}

// ===== HASHTAG CHARTS =====
function prepareHashtagSeries(metric) {
  let filterList = currentHashtagFilter === 'all' ? HASHTAGS : [currentHashtagFilter];
  return filterList.map(h => {
    let rows = hashtagData.filter(r => r.hashtag === h);
    rows.sort((a, b) => a.timestamp.localeCompare(b.timestamp));
    return {
      label: '#' + h,
      data: rows.map(r => ({x: dayLabel(r.timestamp), y: r[metric]})),
      borderColor: HASHTAG_COLORS[h],
      backgroundColor: HASHTAG_COLORS[h] + '20',
      tension: 0.3,
      pointRadius: 4,
      pointHoverRadius: 7,
    };
  });
}

function renderHashtagCharts() {
  ['hviews','hvideos'].forEach(k => { if (charts[k]) charts[k].destroy(); });

  var vwDatasets = prepareHashtagSeries('view_count');
  var viDatasets = prepareHashtagSeries('video_count');

  var vwBounds = yBounds(vwDatasets);
  var viBounds = yBounds(viDatasets);

  charts.hviews = new Chart(document.getElementById('chart-hviews'), {
    type: 'line',
    data: { labels: sortedLabels(vwDatasets), datasets: vwDatasets },
    options: chartOptions('播放量', vwBounds.min, vwBounds.max)
  });
  charts.hvideos = new Chart(document.getElementById('chart-hvideos'), {
    type: 'line',
    data: { labels: sortedLabels(viDatasets), datasets: viDatasets },
    options: chartOptions('视频数', viBounds.min, viBounds.max)
  });
}

function chartOptions(yLabel, yMin, yMax) {
  var range = yMax - yMin || 1;
  return {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: {
        position: 'bottom',
        labels: { color: '#94a3b8', padding: 20, usePointStyle: true, pointStyleWidth: 8 }
      },
      tooltip: {
        backgroundColor: '#1e293b',
        titleColor: '#e2e8f0',
        bodyColor: '#cbd5e1',
        borderColor: '#334155',
        borderWidth: 1,
        callbacks: {
          label: ctx => `${ctx.dataset.label}: ${fmt(ctx.parsed.y)}`
        }
      }
    },
    scales: {
      x: {
        ticks: { color: '#64748b', maxTicksLimit: 12 },
        grid: { color: '#1e293b' }
      },
      y: {
        min: yMin - range * 0.1,
        max: yMax + range * 0.1,
        ticks: { color: '#64748b', callback: v => fmt(v) },
        grid: { color: '#1e293b' }
      }
    }
  };
}

function renderRawTables() {
  document.getElementById('table-accounts').innerHTML = `
    <thead><tr><th>时间</th><th>账号</th><th>粉丝</th><th>点赞</th><th>视频数</th></tr></thead>
    <tbody>${accountData.map(r => `<tr>
      <td>${r.timestamp.replace('T',' ')}</td>
      <td style="color:${ACCOUNT_COLORS[r.username]};font-weight:600;">${r.username}</td>
      <td>${fmt(r.followers)}</td><td>${fmt(r.likes)}</td><td>${r.video_count}</td>
    </tr>`).join('')}</tbody>`;

  document.getElementById('table-hashtags').innerHTML = `
    <thead><tr><th>时间</th><th>话题</th><th>播放量</th><th>视频数</th></tr></thead>
    <tbody>${hashtagData.map(r => `<tr>
      <td>${r.timestamp.replace('T',' ')}</td>
      <td style="color:${HASHTAG_COLORS[r.hashtag]};font-weight:600;">#${r.hashtag}</td>
      <td>${fmt(r.view_count)}</td><td>${fmt(r.video_count)}</td>
    </tr>`).join('')}</tbody>`;
}

// ===== TAB / FILTER SWITCHING =====
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab:nth-child(${{accounts:1,hashtags:2,raw:3}[tab]})`).classList.add('active');
  document.getElementById('tab-accounts').classList.toggle('hidden', tab !== 'accounts');
  document.getElementById('tab-hashtags').classList.toggle('hidden', tab !== 'hashtags');
  document.getElementById('tab-raw').classList.toggle('hidden', tab !== 'raw');

  if (tab === 'accounts') renderAccountCharts();
  if (tab === 'hashtags') renderHashtagCharts();
  if (tab === 'raw') renderRawTables();
}

function filterAccounts(acc, el) {
  currentAccountFilter = acc;
  document.querySelectorAll('#tab-accounts .chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderAccountCharts();
}

function filterHashtags(h, el) {
  currentHashtagFilter = h;
  document.querySelectorAll('#tab-hashtags .chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderHashtagCharts();
}

// ===== INIT =====
renderAccountSummary();
renderHashtagSummary();
renderAccountCharts();
</script>
